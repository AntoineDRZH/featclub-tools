    .day-card.selected { border-color: var(--orange); background: var(--gris2); }

    .day-tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 9px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }

    .result-card { background: var(--gris); border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
    .result-header { padding: 20px 22px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 14px; }

    .result-day-title { font-size: 14px; font-weight: 500; color: var(--blanc); }
    .result-section { padding: 16px 22px 0; }
    .result-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; font-weight: 500; margin-bottom: 8px; }

    .copy-btn { display: block; width: calc(100% - 44px); margin: 16px 22px 22px; padding: 13px; background: var(--orange); color: var(--blanc); border: none; border-radius: 4px; font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }

</head>

const typeColors = {"Inspiration":{bg:"#FFF3ED",tc:"#C2410C",border:"#FED7AA"},"Conseil":{bg:"#F0FDF9",tc:"#0F766E",border:"#99F6E4"},"Communauté":{bg:"#EFF6FF",tc:"#1D4ED8",border:"#BFDBFE"},"Coulisses":{bg:"#FDF4FF",tc:"#7E22CE",border:"#E9D5FF"},"Promo":{bg:"#FFF1F2",tc:"#BE123C",border:"#FECDD3"},"Éducation":{bg:"#FFFBEB",tc:"#B45309",border:"#FDE68A"},"Témoignage":{bg:"#F0FDF4",tc:"#15803D",border:"#BBF7D0"},"Recap":{bg:"#F8FAFC",tc:"#475569",border:"#CBD5E1"},"Bilan":{bg:"#F8FAFC",tc:"#475569",border:"#CBD5E1"}};

let activeWeek=0,selectedDay=null;

function renderWeeks(){document.getElementById('weeks').innerHTML=['Semaine 1','Semaine 2','Semaine 3','Semaine 4'].map((w,i)=>`<button class="week-btn ${i===activeWeek?'active':''}" onclick="setWeek(${i})">${w}</button>`).join('');}
function setWeek(i){activeWeek=i;renderWeeks();renderDays();}
function renderDays(){const start=activeWeek*7;const days=posts.slice(start,start+(activeWeek===3?9:7));document.getElementById('days').innerHTML=days.map(p=>{const c=typeColors[p.type]||typeColors["Recap"];return`<div class="day-card ${selectedDay===p.day?'selected':''}" onclick="showPost(${p.day})"><div class="day-num">J${p.day}</div><div class="day-info"><span class="day-tag" style="background:${c.bg};color:${c.tc};border:0.5px solid ${c.border}">${p.type}</span><div class="day-idea">${p.idea}</div><div class="day-format">${p.format}</div></div><div class="day-arrow">›</div></div>`;}).join('');}

function showPost(day){
  selectedDay=day;renderDays();
  const p=posts.find(x=>x.day===day);
  document.getElementById('result-panel').classList.add('visible');
  document.getElementById('result-panel').innerHTML=`<div class="result-card"><div class="result-header"><div class="result-day-badge">J${p.day}</div><div><div class="result-day-type">${p.type} · ${p.format}</div><div class="result-day-title">${p.idea}</div></div></div><div class="result-section"><div class="result-label" style="color:#2A8C7E">📝 Légende</div><div class="result-content">${p.legende.replace(/\n/g,'<br>')}</div></div><div class="result-section"><div class="result-label" style="color:#E8541A">🎯 Appel à l'action</div><div class="result-content">${p.cta}</div></div><div class="result-section"><div class="result-label" style="color:#888">🏷️ Hashtags</div><div class="result-content result-hashtags">${p.hashtags}</div></div><div class="result-section" style="padding-bottom:0"><div class="result-label" style="color:#7E22CE">📸 Conseil visuel</div><div class="result-content result-tip">${p.conseil}</div></div><button class="copy-btn" id="copy-btn" onclick="copyPost(${p.day})">Copier le post complet</button></div>`;
  if(window.innerWidth<=700)document.getElementById('result-panel').scrollIntoView({behavior:'smooth'});
}

function copyPost(day){const p=posts.find(x=>x.day===day);navigator.clipboard.writeText(`${p.legende}\n\n${p.cta}\n\n${p.hashtags}`);const btn=document.getElementById('copy-btn');btn.textContent='✓ Copié !';btn.classList.add('copied');setTimeout(()=>{btn.textContent='Copier le post complet';btn.classList.remove('copied');},2000);}

renderWeeks();renderDays();
</script>
